<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPERA</title>
    <style>
:root { --dot-size: clamp(22px, 6.8vmin, 58px); --gap: clamp(4px, 1.2vmin, 12px); --dot-scale: 1; --gap-ratio: 1; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; }
.t, .n { position: fixed; text-transform: uppercase; z-index: 20; }
.t { inset: 0; margin: 0; pointer-events: none; font-weight: 700; letter-spacing: -.03em; }
.t span, .n a { position: fixed; line-height: 1; white-space: nowrap; }
.b { position: fixed; top: 1.2vmin; right: 2vw; font-size: 12px; opacity: .5; z-index: 20; }
.n { font-weight: 900; z-index: 25; }
.mu { position: fixed; z-index: 22; display: none; flex-direction: column; font-weight: 900; text-transform: uppercase; line-height: 1.05; overflow-y: auto; scrollbar-width: none; }
.mu::-webkit-scrollbar { display: none; }
.mu.on { display: flex; }
.mu::before { content: ''; position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.92); }
.mu a, .mu span { color: #fff; text-decoration: none; padding-left: .62em; text-indent: -.62em; }
.mu .ab { padding-left: 0; text-indent: 0; }
.mu span { opacity: .3; }
.mu b { font-size: 1.6em; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-bottom: .45em; }
.mu .ab { margin-top: .9em; }
.tx { position: fixed; z-index: 19; display: none; font-weight: 900; line-height: 1.15; overflow-y: auto; scrollbar-width: none; }
.tx::-webkit-scrollbar { display: none; }
.tx::before { content: ''; position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.8); }
.tx p { margin: 0 0 1em; }
.tx a { color: #fff; }
.n a { color: #fff; text-decoration: none; }
.stage { position: fixed; inset: 0; z-index: 1; display: grid; justify-content: center; align-content: center; overflow: hidden; }
.world { transform-origin: center; }
.grid { position: relative; display: grid; gap: calc(var(--gap) * var(--gap-ratio)); justify-content: center; align-content: center; }
/* the disc: flat oklch face, no gradient. --l is set per frame by the light
   loop; chroma falls with it so a bulb greys before it goes dark. A tight
   halo scales with the disc; a faint wide halo only appears past 2x scale. */
.dot { --l: .22; --c: max(0, calc(var(--cmax,.03) * (var(--l) - .22) / (var(--lmax,.94) - .22)));
  position: relative; width: calc(100% * var(--dot-scale)); height: calc(100% * var(--dot-scale));
  border-radius: 50%; background: oklch(calc(var(--l) * 100%) var(--c) var(--h,85)); }
.dot::before, .dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; z-index: -1;
  background: oklch(calc(var(--l) * 100%) calc(var(--c) * .7) var(--h,85)); }
.dot::before { filter: blur(calc(var(--dot-size) * .10)); transform: scale(1.18); opacity: calc(var(--l) * .32); }
.dot::after { filter: blur(calc(var(--dot-size) * .30)); transform: scale(1.7); opacity: calc(var(--l) * var(--wide,0)); }
.cue { position: fixed; z-index: 22; color: #fff; text-transform: uppercase; font-weight: 800; background: #000;
  left: 50%; bottom: 14vh; transform: translateX(-50%); max-width: 92vw; padding: .06em .3em; font-size: clamp(16px, 3.8vw, 48px); letter-spacing: -.03em; white-space: nowrap; visibility: hidden; }
.say { position: fixed; z-index: 23; background: #000; color: #fff; font-weight: 900; text-transform: uppercase; font-size: clamp(11px, 1.6vw, 18px); line-height: 1; padding: .35em .5em; white-space: nowrap; pointer-events: none; }
.st { position: fixed; z-index: 26; right: 2vw; bottom: 1.2vh; text-transform: uppercase; font-weight: 900; font-size: clamp(12px, 2vw, 16px); }
    </style>
  </head>
  <body>
    <h1 class="t" id="ti"></h1>
    <span class="b" id="bd">%%BYTES%% B</span>
    <nav class="n"><a href="#" id="mn">Menu</a><a href="#" id="pb">Play</a></nav>
    <div class="mu" id="mu"></div>
    <div class="tx" id="tx"></div>
    <main class="stage">
      <div id="world" class="world"><div id="grid" class="grid"></div></div>
    </main>
    <div id="cue" class="cue"></div>
    <script src="engine.js"></script>
    <script src="OPERA.js"></script>
    <script>
document.title = O.opera.title;
// Type on the grid. The title's capitals span exactly two dot rows (top of
// row two to the bottom of row three); nav capitals span exactly one row, on
// the second-to-last row. Left edges sit on the second column, right edges on
// the second-to-last. A title too wide for one line wraps to the next pair of
// rows, one empty row between.
function grid() {
  var r = [], c = [], D = 0;
  document.querySelectorAll('#grid .dot').forEach(function (d) {
    var b = d.getBoundingClientRect();
    D = b.width;
    if (b.top >= 0 && b.bottom <= innerHeight) r.push(Math.round(b.top));
    if (b.left >= 0 && b.right <= innerWidth) c.push(Math.round(b.left));
  });
  var u = function (a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; }); };
  return { r: u(r), c: u(c), D: D };
}
var cv = document.createElement('canvas').getContext('2d');
function metric(w, S) {
  cv.font = w + ' ' + S + 'px Helvetica, Arial, sans-serif';
  var m = cv.measureText('H');
  // with line-height 1 the baseline sits half the leading plus the ascent below the box top
  return { cap: m.actualBoundingBoxAscent, base: (S - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent };
}
// place an element so its capitals run from y to y + h
function set(el, w, h, y) {
  var S = 100, m = metric(w, S);
  S = S * h / m.cap; m = metric(w, S);
  el.style.fontSize = S + 'px';
  el.style.top = (y - (m.base - m.cap)) + 'px';
  return S;
}
function layout() {
  var g = grid(); if (g.r.length < 4 || g.c.length < 4) return;
  var P = g.r[1] - g.r[0], L = g.c[1], R = g.c[g.c.length - 2] + g.D;
  // title: two-row capitals, greedy word wrap; if even one word won't fit,
  // one-row capitals, still on the grid
  ti.textContent = '';
  var probe = document.createElement('span'); ti.appendChild(probe);
  var fits = function (h) { set(probe, 700, h, 0); return O.opera.title.split(' ').every(function (w) { probe.textContent = w; return probe.getBoundingClientRect().width <= R - L; }); };
  var two = 2 * g.D + (P - g.D), h = fits(two) ? two : g.D, step = h === two ? 3 : 2;
  set(probe, 700, h, 0);
  var lines = [], line = '';
  O.opera.title.split(' ').forEach(function (w) {
    probe.textContent = line ? line + ' ' + w : w;
    if (line && probe.getBoundingClientRect().width > R - L) { lines.push(line); line = w; } else line = probe.textContent;
  });
  lines.push(line); ti.removeChild(probe);
  lines.forEach(function (t, i) {
    var sp = document.createElement('span'); sp.textContent = t; ti.appendChild(sp);
    set(sp, 700, h, g.r[1] + i * step * P);
    sp.style.left = L + 'px';
  });
  // nav: one-row capitals on the second-to-last row, MENU left, PLAY right
  var a = document.querySelectorAll('.n a'), y = g.r[g.r.length - 2];
  a.forEach(function (el) { set(el, 900, g.D, y); });
  a[0].style.left = L + 'px';
  a[1].style.left = (R - a[1].getBoundingClientRect().width) + 'px';
  // The menu breaks the grid on purpose: plain type in one column, sitting a
  // row above the buttons and growing upward. The buttons never move.
  var fs = parseFloat(a[0].style.fontSize);
  mu.style.left = L + 'px';
  mu.style.width = (innerWidth - L - 4) + 'px';
  mu.style.bottom = (innerHeight - a[0].getBoundingClientRect().top + P) + 'px';
  mu.style.fontSize = fs + 'px';
  mu.style.maxHeight = (a[0].getBoundingClientRect().top - P - g.r[0]) + 'px';
  // about text: a plain column from row five down to a row above the buttons
  var tt = g.r[Math.min(4, g.r.length - 1)];
  tx.style.left = L + 'px';
  tx.style.width = (innerWidth - L - 4) + 'px';
  tx.style.top = tt + 'px';
  tx.style.fontSize = Math.max(14, fs * .55) + 'px';
  tx.style.maxHeight = (a[0].getBoundingClientRect().top - P - tt) + 'px';
}
var MENU = '%%MENU%%';
// the menu's content never changes, so build it once
mu.innerHTML = '<b>Dot Operas</b>' + MENU.map(function (o) {
  return o[2] ? '<a href="' + o[0] + '.html">\u2022 ' + o[1] + '</a>' : '<span>\u2022 ' + o[1] + '</span>';
}).join('') + '<a class="ab" href="about.html">About</a>';
mn.onclick = function (e) {
  e.preventDefault();
  var on = mu.classList.toggle('on');
  mn.textContent = on ? 'Close' : 'Menu';
  ti.style.visibility = on ? 'hidden' : '';
  layout();
  mu.scrollTop = mu.scrollHeight;                 // open at the bottom, nearest the thumb
  // extend upward: each row rises from the nav into place, bottom first
  if (on) [].slice.call(mu.children).reverse().forEach(function (x, i) {
    x.animate([{ transform: 'translateY(' + (mu.getBoundingClientRect().bottom - x.getBoundingClientRect().top) + 'px)', opacity: 0 }, { transform: 'none', opacity: getComputedStyle(x).opacity }],
      { duration: 260, delay: i * 28, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  });
};
layout();
addEventListener('resize', function () { requestAnimationFrame(layout); });
if (location.search.indexOf('scale') > -1) {
  O.initAudio();
  var phrase = [0, 4, 7, 12], t = 0;
  ['tenor', 'soprano', 'bass', 'arp'].forEach(function (v) {
    phrase.forEach(function (s) {
      (function (v, s, at) { setTimeout(function () { O.voice(v, s, O.now(), .35, { vol: .2 }); }, at); })(v, s, t);
      t += 350;
    });
    t += 1000;
  });
  setTimeout(function () { O.voice('soprano', 0, O.now(), 4, { vol: .2 }); }, t);
} else if (window.PAGE) {
  // the index: the same chrome, no opera. PLAY goes to the first opera;
  // the index opens with the menu showing (the list is the programme).
  pb.href = FIRST + '.html';
  if (PAGE === 'index') mn.onclick({ preventDefault: function () {} });
  if (PAGE === 'about') { tx.innerHTML = TEXT; tx.style.display = 'block'; }
} else if (location.search.indexOf('step') > -1) {
  O.initStep();
} else {
  pb.onclick = function (e) {
    e.preventDefault();
    if (pb.textContent === 'Play') { O.start(); O.load(O.opera); pb.textContent = 'Pause'; }
    else { O.stop(); pb.textContent = 'Play'; }
    layout();
  };
}
    </script>
  </body>
</html>
