<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opera House</title>
<meta name="description" content="Eight mini-operas, one shared engine, one grid of light." />
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1.t{margin:0;padding:6vmin 4vw 3vh;line-height:.84;letter-spacing:-.03em;text-transform:uppercase}
h1.t span{display:block;font-size:clamp(46px,13vw,140px);font-weight:900;text-shadow:0 0 2px #fff,0 0 10px rgba(255,255,255,.55),0 0 26px rgba(255,255,255,.28)}
h1.t .sub{display:block;margin-top:1.6vmin;font-size:clamp(13px,2.3vw,20px);font-weight:800;letter-spacing:0;text-shadow:none;opacity:.75}
main{padding:0 4vw 6vh}
ol{list-style:none;margin:0;padding:0}
li{border-top:1px solid rgba(255,255,255,.15)}
li:last-child{border-bottom:1px solid rgba(255,255,255,.15)}
a.op{display:flex;align-items:baseline;gap:3vw;padding:2.2vh 0;color:#fff;text-decoration:none;text-transform:uppercase}
.no{width:2ch;font-size:clamp(13px,2vw,20px);font-weight:700;opacity:.4}
.ti{flex:1;font-size:clamp(20px,6vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1}
.la{font-size:clamp(11px,1.6vw,15px);font-weight:700;opacity:.5}
.sz{padding:.3em .6em;border:1px solid rgba(255,255,255,.35);border-radius:2px;font-size:clamp(11px,1.6vw,15px);font-weight:700;opacity:.85;white-space:nowrap}
a.op:hover .ti{text-shadow:0 0 2px #fff,0 0 10px rgba(255,255,255,.6)}
p.dl{margin-top:5vh;font-size:13px;line-height:1.9;opacity:.6}
p.dl a{color:#fff}
</style>
</head>
<body>
<h1 class="t"><span>OPERA</span><span>HOUSE</span><span class="sub">%%STRAP%%</span></h1>
<main>
<ol>
%%LIST%%
</ol>
<p class="dl">%%DL%%</p>
</main>
</body>
</html>
